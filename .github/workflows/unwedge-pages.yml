name: Unwedge Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  unwedge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List and cancel wedged Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== listing pages deployments ==="
          gh api "repos/${{ github.repository }}/pages/deployments" --paginate --jq '.[] | "\(.id) \(.state) \(.build_version)"' || true
          echo "=== trying cancel of each in-progress ==="
          gh api "repos/${{ github.repository }}/pages/deployments" --paginate --jq '.[] | select(.state == "in_progress") | .id' | while read id; do
            echo "cancelling $id"
            gh api --method POST "repos/${{ github.repository }}/pages/deployments/$id/cancel" || true
          done
