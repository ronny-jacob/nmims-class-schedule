name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Materialize Trim V roster from secret
        env:
          TRIM_V_STUDENT_LIST_B64: ${{ secrets.TRIM_V_STUDENT_LIST_B64 }}
        run: |
          if [ -z "${TRIM_V_STUDENT_LIST_B64}" ]; then
            echo "::error::TRIM_V_STUDENT_LIST_B64 secret is missing. Add it to this repo's settings (base64 of sources/Trim-V student list.xlsx)."
            exit 1
          fi
          mkdir -p sources
          echo "$TRIM_V_STUDENT_LIST_B64" | base64 -d > "sources/Trim-V student list.xlsx"
          ls -la sources/

      # Rebuild data.json + index.html from the committed extract.py state.
      # TIMETABLE is wired by the mail bot (check-timetable.yml). We do not
      # fall back to the manual starter here — if TIMETABLE is unset and
      # downloads/ has no dated Trim V file, the build fails loudly. The
      # bot must run first.
      - name: Rebuild from committed sources
        env:
          CI: '1'
        run: python extract.py

      - name: Validate placements schema
        run: python tests/test_placements_schema.py

      - name: Bump SW cache version
        run: |
          TS="$(date -u +%Y%m%d%H%M%S)"
          sed -i.bak -E "s|var CACHE = 'nmims-cc-v[0-9]+';|var CACHE = 'nmims-cc-v${TS}';|" sw.js
          rm sw.js.bak
          echo "Bumped sw.js CACHE to nmims-cc-v${TS}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
