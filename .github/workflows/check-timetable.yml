name: Check Timetable Email

on:
  schedule:
    # Hourly Weekdays 8 AM to 11 PM IST (UTC 2:30 – 17:30), skips 12 AM–8 AM
    - cron: '30 2-17 * * 1-5'
    # Saturday safety net (the every-minute Apps Script drives real-time checks)
    - cron: '30 2-17 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    if: github.repository == 'ronny-jacob/nmims-class-schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Materialize roster files from secrets
        env:
          STUDENT_LIST_B64: ${{ secrets.STUDENT_LIST_B64 }}
          LAST_YEAR_LIST_B64: ${{ secrets.LAST_YEAR_LIST_B64 }}
        run: |
          mkdir -p sources
          echo "$STUDENT_LIST_B64" | base64 -d > "sources/Division wise List- Trimester IV.xlsx"
          echo "$LAST_YEAR_LIST_B64" | base64 -d > "sources/First Year Division list.xlsx"
          ls -la sources/

      - name: Configure git
        run: |
          git config user.name "Timetable Bot"
          git config user.email "bot@nmims-class-schedule"

      - name: Check inbox and update
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          IMAP_LOOKBACK_DAYS: ${{ secrets.IMAP_LOOKBACK_DAYS }}
        run: python check_mail.py

      # The bot commits with GITHUB_TOKEN, which GitHub refuses to use to
      # trigger other workflows. Dispatch the Pages deploy explicitly so new
      # timetables actually reach the live site (only when HEAD moved).
      - name: Deploy updated site to Pages
        if: success() && hashFiles('**/*') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_AFTER="$(git rev-parse HEAD)"
          if [ "${HEAD_AFTER}" != "${GITHUB_SHA}" ]; then
            echo "Bot pushed ${HEAD_AFTER}; dispatching Pages deploy"
            gh workflow run deploy-pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
          else
            echo "No changes pushed by bot; skipping Pages deploy"
          fi

      - name: Mirror update to staging
        if: success()
        env:
          STAGING_PUSH_TOKEN: ${{ secrets.STAGING_PUSH_TOKEN }}
        run: |
          if [ -z "${STAGING_PUSH_TOKEN}" ]; then
            echo "STAGING_PUSH_TOKEN not set — skipping staging mirror"
            exit 0
          fi
          HEAD_AFTER="$(git rev-parse HEAD)"
          if [ "${HEAD_AFTER}" = "${GITHUB_SHA}" ]; then
            echo "No changes pushed by bot; skipping staging mirror"
            exit 0
          fi
          echo "Bot pushed ${HEAD_AFTER}; mirroring to staging"
          git remote add staging "https://x-access-token:${STAGING_PUSH_TOKEN}@github.com/ronny-jacob/nmims-class-schedule-staging.git"
          if git -c http.https://github.com/.extraheader="" push staging main 2>push_err.txt; then
            echo "Staging mirror pushed OK"
          else
            echo "Staging diverged (unpromoted edits on staging). New timetable will reach staging on next Promote."
            cat push_err.txt
          fi
