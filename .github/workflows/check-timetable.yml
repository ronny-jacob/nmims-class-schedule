name: Check Timetable Email

on:
  schedule:
    # Every hour from 6 AM to 11 PM IST (UTC 0:30 – 17:30)
    - cron: '30 0-17 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "Timetable Bot"
          git config user.email "bot@nmims-class-schedule"

      - name: Check inbox and update
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          IMAP_LOOKBACK_DAYS: ${{ secrets.IMAP_LOOKBACK_DAYS }}
        run: python check_mail.py
