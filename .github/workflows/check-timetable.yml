name: Check Timetable Email

on:
  schedule:
    # Hourly Weekdays 8 AM to 11 PM IST (UTC 2:30 – 17:30), skips 12 AM–8 AM
    - cron: '30 2-17 * * 1-5'
    # Saturday safety net (the every-minute Apps Script drives real-time checks)
    - cron: '30 2-17 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Materialize roster files from secrets
        env:
          STUDENT_LIST_B64: ${{ secrets.STUDENT_LIST_B64 }}
          LAST_YEAR_LIST_B64: ${{ secrets.LAST_YEAR_LIST_B64 }}
        run: |
          mkdir -p sources
          echo "$STUDENT_LIST_B64" | base64 -d > "sources/Division wise List- Trimester IV.xlsx"
          echo "$LAST_YEAR_LIST_B64" | base64 -d > "sources/First Year Division list.xlsx"
          ls -la sources/

      - name: Configure git
        run: |
          git config user.name "Timetable Bot"
          git config user.email "bot@nmims-class-schedule"

      - name: Check inbox and update
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          IMAP_LOOKBACK_DAYS: ${{ secrets.IMAP_LOOKBACK_DAYS }}
        run: python check_mail.py
